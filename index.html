<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trello</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <img
        class="logo-trello"
        height="160px"
        src="https://1000logos.net/wp-content/uploads/2021/05/Trello-logo.png"
        alt=""
      />
      <form action="">
        <h1>Fazer Login</h1>
        <input type="text" name="name" placeholder="Digite seu nome" />

        <input type="password" name="password" placeholder="Digite sua senha" />

        <input type="submit" value="Fazer login" />
        <span>Ou</span>
        <ul>
          <li>
            <button>
              <img
                height="20px"
                src="https://www.icosix.com/uploads/icons/2025/09/google.png"
                alt=""
              />
              Continuar com o Google
            </button>
          </li>
          <li>
            <button>
              <img
                height="20px"
                src="https://cdn-icons-png.flaticon.com/512/732/732221.png"
                alt=""
              />
              Continuar com o Microsoft
            </button>
          </li>
          <li>
            <button>
              <img
                height="20px"
                src="https://cdn-icons-png.flaticon.com/512/0/747.png"
                alt=""
              />
              Continuar com a Apple
            </button>
          </li>
          <li>
            <button>
              <img
                height="20px"
                src="https://cdn-icons-png.flaticon.com/512/2111/2111615.png"
                alt=""
              />
              Continuar com o Slack
            </button>
          </li>
        </ul>
      </form>
    </main>
    <footer>
      <span
        >© Desenvolvido para estudos por
        <a href="https://github.com/guvdev" target="_blank">@guvdev</a></span
      >
    </footer>
  </body>
</html>
